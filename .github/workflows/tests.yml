name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Lua and LuaRocks are built from their GitHub sources. The Ubuntu package mirrors
      # stopped resolving on the runners (#273), and the lua.org download kept timing out.
      # LuaJIT is Lua 5.1 compatible, which is what the game runs.
      - name: Install Lua
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "luajit-2.1"

      - name: Install LuaRocks
        uses: luarocks/gh-actions-luarocks@v7
        with:
          # The v3.13.0 tag's commit. A tag name does not work: GitHub drops the "v" from
          # the archive's folder name, and the action then cannot find configure.
          luaRocksVersion: "@3421bedc2ce2b64e79530bb97497531b014899a8"

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted
