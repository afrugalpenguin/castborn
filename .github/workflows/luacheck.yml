name: Luacheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Lua 5.1 and LuaRocks come from Ubuntu's package mirrors. Building Lua from the
      # lua.org source download kept timing out.
      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks

      - name: Install luacheck
        run: sudo luarocks --lua-version 5.1 install luacheck

      - name: Run luacheck
        run: luacheck .
